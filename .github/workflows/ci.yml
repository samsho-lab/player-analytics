name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: pytest -v
      - name: end-to-end run
        run: |
          python -m analytics generate --players 2000 --out data/events.csv
          python -m analytics report data/events.csv --out /tmp/report
